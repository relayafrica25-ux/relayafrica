<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay.africa | Future of Hiring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              relay: {
                dark: '#0a0a12',
                card: '#13131f',
                accent: '#00ff9d',
                purple: '#7000ff',
                surface: '#1c1c2e'
              }
            },
            backgroundImage: {
              'hero-pattern': "radial-gradient(circle at 50% 0%, rgba(112, 0, 255, 0.15) 0%, transparent 70%), radial-gradient(circle at 80% 50%, rgba(0, 255, 157, 0.1) 0%, transparent 50%)",
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'spin-slow': 'spin 20s linear infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0a0a12;
        color: #ffffff;
      }
      .glass-card {
        background: rgba(19, 19, 31, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .gradient-text {
        background: linear-gradient(135deg, #ffffff 0%, #a0aec0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .accent-text {
        background: linear-gradient(135deg, #00ff9d 0%, #00cc7e 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .micro-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.6);
      }
      .glass-pill {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 100px;
        padding: 6px 16px;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(8px);
      }
      .horizontal-line {
        height: 1px;
        background-color: rgba(255, 255, 255, 0.1);
      }
    </style>
